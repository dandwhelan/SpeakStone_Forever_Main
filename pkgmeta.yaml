package-as: SpeakStone_Forever_Main
enable-nolib-creation: no

# The voice info addon is Load-on-Demand, so it must be its own top-level
# folder in AddOns. It ships in the same zip as the base addon.
move-folders:
  SpeakStone_Forever_Main/SpeakStone_VoiceInfo: SpeakStone_VoiceInfo

# Must match the .toc basename: WoW looks for AddOns/<Folder>/<Folder>.toc.
#
# This addon is GENERATED by tools/build_forever_main.py in the SpeakStone
# build workspace from the retail SpeakStone_Main payload. Do not hand-edit
# the Lua here -- fix it in SpeakStone_Main and regenerate, or the two drift.
ignore:
  - README.md
  - .github
  - .git
  - .gitignore
